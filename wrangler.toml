name = "billio"
account_id = "b387ad0edb069857cdf76793aa0855cc"
compatibility_date = "2025-06-09"

# The app is served as static files. Only /api/* runs the Worker code in
# worker/index.ts (the in-app assistant's CopilotKit runtime).
main = "worker/index.ts"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Public values the Worker reads (not secrets). ANTHROPIC_API_KEY is a secret:
# set it in the dashboard (Settings → Variables and Secrets) or with
# `npx wrangler secret put ANTHROPIC_API_KEY`; locally, in .dev.vars.
[vars]
SUPABASE_URL = "https://kqywszzcivoxxxsljlzw.supabase.co"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# ── Environment overrides ─────────────────────────────────────
# VITE_* vars are injected by Vite at BUILD time (they're baked
# into the JS bundle). They are NOT runtime Worker vars — do NOT
# put them in [vars] here.
#
# Set them before running `vite build`:
#   VITE_SUPABASE_URL=...
#   VITE_SUPABASE_ANON_KEY=...
#   VITE_MOCK_AUTH=false
#   VITE_SENTRY_DSN=...  (optional)
#
# For CI (GitHub Actions): add as repository secrets.
# For local builds: set in .env.local (never commit that file).
